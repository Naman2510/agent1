[project]
name = "vaanios-backend"
version = "0.1.0"
description = "VaaniOS backend — multilingual conversational AI voice mentor"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "structlog>=24.4",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "fakeredis[lua]>=2.26",
    "ruff>=0.8",
    "mypy>=1.13",
]
# Installed only where evaluation runs; never in the production image (ADR-0015).
eval = ["jiwer>=3.0", "rank-bm25>=0.2.2", "mlflow>=2.18", "numpy>=1.26"]
# Local voice models for offline evaluation and CI (ADR-0002/0003).
voice-local = ["faster-whisper>=1.1", "onnxruntime>=1.20"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]        # hardcoded test passwords are intentional
"migrations/*" = ["E501", "N999"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The database engine is session-scoped, and asyncpg connections are bound to the loop that
# created them. Without pinning both scopes, each test gets a fresh loop and every pooled
# connection raises "attached to a different loop".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*"]
disallow_untyped_defs = false

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's asyncio bridge executes code inside greenlets, which the default tracer cannot
# follow. Without this, whole service modules report as uncovered even though the tests exercise
# them — a false number, and a misleading one in the wrong direction.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]
