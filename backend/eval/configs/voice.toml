# The voice front end as it ships: every value here is the production default
# (app/core/config.py, app/voice/session.py) — tests/unit/test_eval_voice.py holds them together.
suite = "voice"

[vad]
enter_threshold = 0.5
exit_threshold = 0.35
min_speech_ms = 250
min_silence_ms = 500

[session]
pre_roll_ms = 500
min_utterance_ms = 400
merge_window_ms = 1200
semantic_endpointing = false
semantic_silence_ms = 250

# A stand-in for a streaming recogniser: perfect words, each stable this long after it is spoken.
[recogniser]
stable_lag_ms = 300
