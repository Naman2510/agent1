# Phase 1 — SSH hardening baseline.
# Install to: /etc/ssh/sshd_config.d/99-hardening.conf
# Apply with: sshd -t && systemctl reload ssh
#
# Requires sshd_config to contain "Include /etc/ssh/sshd_config.d/*.conf"
# (the Debian/Ubuntu default sshd_config already does).

# --- Authentication ---
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
UsePAM yes

# --- Cryptography: Elliptic Curve only, modern AEAD ciphers only ---
HostKeyAlgorithms ssh-ed25519
PubkeyAcceptedAlgorithms ssh-ed25519
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# --- Session hardening ---
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
MaxAuthTries 3
LoginGraceTime 20
ClientAliveInterval 300
ClientAliveCountMax 2

# --- Logging ---
LogLevel VERBOSE
