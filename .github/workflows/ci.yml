name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref: a queue of stale runs helps nobody.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  # Tier T0 (EVALUATION.md §6): lint, types, and the full test suite with every external model
  # provider faked. No paid API call runs here, by design.
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as Compose, so CI and local development cannot diverge, and the Phase 5
        # pgvector migration needs no CI change.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vaanios
          POSTGRES_PASSWORD: vaanios
          POSTGRES_DB: vaanios_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaanios"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        working-directory: backend
        run: mypy app

      - name: Test
        working-directory: backend
        env:
          VAANIOS_TEST_DATABASE_URL: postgresql+asyncpg://vaanios:vaanios@localhost:5432/vaanios_test
        run: pytest -q --cov --cov-report=term-missing --cov-fail-under=80

      - name: Migrations are reversible and match the models
        working-directory: backend
        env:
          VAANIOS_DATABASE_URL: postgresql+asyncpg://vaanios:vaanios@localhost:5432/vaanios_test
          VAANIOS_REDIS_URL: redis://localhost:6379/0
          VAANIOS_JWT_SECRET: ci-secret-that-is-at-least-32-characters
        run: |
          python scripts/reset_schema.py
          alembic upgrade head
          # `alembic check` fails if the models have drifted from the migrations — the failure
          # mode where tests build one schema and production runs another.
          alembic check
          alembic downgrade base
          alembic upgrade head

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans history, not just the tip

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency audit
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .
          # Non-blocking for now: a fresh advisory in a transitive dependency should surface, not
          # block an unrelated change. Revisit once the dependency set settles (Phase 9).
          pip-audit --progress-spinner off || echo "::warning::pip-audit reported findings"

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f infra/docker/backend.Dockerfile -t vaanios-backend:ci .
      - name: Image runs as a non-root user
        run: |
          uid=$(docker run --rm vaanios-backend:ci id -u)
          test "$uid" != "0" || { echo "container runs as root"; exit 1; }
