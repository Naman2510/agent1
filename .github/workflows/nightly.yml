name: Nightly (tier T2)

# EVALUATION.md §6, tier T2: suites that need local models downloaded first. Today that is `stt`:
# faster-whisper on the synthetic voice dataset, whose weights come from Hugging Face.
#
# Scheduled and on-demand runs start only once this file is on the default branch; until then,
# and afterwards too, it runs whenever what it measures changes.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "backend/eval/suites/stt.py"
      - "backend/eval/configs/stt*.toml"
      - "backend/eval/experiments/**"
      - "backend/eval/baselines/stt*.json"
      - "backend/constraints.txt"
      - "backend/app/providers/stt/**"
      - "backend/app/providers/tts/espeak.py"
      - "backend/scripts/bench_voice_loop.py"
      - "datasets/v1/voice/**"
      - ".github/workflows/nightly.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stt:
    name: Speech recognition, local model (stt)
    runs-on: ubuntu-latest
    # numpy and OpenBLAS pick their kernels, and OpenBLAS its threads, when they load, before the
    # suite can pin anything: so the process starts with them (eval/suites/stt.py STARTUP_PINS,
    # which a test holds to these). Each is what the AMD EPYC 7763 behind the baselines chose itself.
    env:
      NPY_DISABLE_CPU_FEATURES: "X86_V4,AVX512_ICL,AVX512_SPR"
      OPENBLAS_CORETYPE: "Haswell"
      OPENBLAS_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[eval,voice-local]"
      - name: Cache the recogniser's weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('backend/eval/configs/stt.toml') }}
      # For the voice loop below: the VAD's weights, pinned and checksummed, and the local voice.
      - name: Cache the VAD's weights
        uses: actions/cache@v4
        with:
          path: backend/models
          key: models-${{ hashFiles('backend/scripts/fetch_models.sh') }}
      - name: Fetch the VAD's weights, and install the local voice
        run: |
          bash backend/scripts/fetch_models.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends espeak-ng
      # Two runners once computed different transcripts from the same audio (PHASE_8_AUDIT
      # D8-15). The suite pins the arithmetic itself (eval/suites/stt.py NUMERICS); this records
      # the machine, and which kernels numpy, OpenBLAS, CTranslate2 and MKL chose under the pins.
      - name: Which machine, and which kernels
        working-directory: backend
        run: |
          set -o pipefail
          lscpu | grep -E '^(Model name|CPU\(s\)|Flags)' | cut -c1-200 | tee t2-report.txt
          # What numpy and OpenBLAS choose on this machine without the job's pins, and with them.
          probe='import numpy._core._multiarray_umath as m, threadpoolctl; print("numpy dispatch", [t for t in m.__cpu_dispatch__ if m.__cpu_features__.get(t)], "OpenBLAS", [(i.get("architecture"), i.get("num_threads")) for i in threadpoolctl.threadpool_info() if i.get("internal_api") == "openblas"])'
          echo "unpinned: $(env -u NPY_DISABLE_CPU_FEATURES -u OPENBLAS_CORETYPE -u OPENBLAS_NUM_THREADS python -c "$probe")" | tee -a t2-report.txt
          echo "pinned:   $(python -c "$probe")" | tee -a t2-report.txt
          # oneDNN (inside CTranslate2) runs the encoder's convolutions and names the kernel it used.
          CT2_VERBOSE=1 ONEDNN_VERBOSE=1 python - <<'EOF' 2>&1 | { grep -E 'CPU:|ISA|MKL|backend|WARNING|onednn_verbose,(info,cpu,isa|exec,cpu,convolution)' || true; } | cut -c1-160 | sort -u | tee -a t2-report.txt
          import numpy as np
          from eval.suites import stt
          stt.pin_numerics()
          from faster_whisper import WhisperModel
          model = WhisperModel("small", device="cpu", compute_type="int8", cpu_threads=4)
          segments, _ = model.transcribe(np.zeros(16000, dtype=np.float32))
          list(segments)
          EOF
      # Each config runs once. An experiment's two configs are held to their baselines inside the
      # experiment's own runs; any other T2 config runs on its own. A config with no baseline yet
      # has one written and printed, to be reviewed and committed. Exit 3 means a run differed
      # from a baseline computed on another CPU model: nothing promises the same numbers across
      # CPU models (FC-006), so it is a warning with the differences in the report, not a failure.
      - name: Every tier-T2 experiment and config, each run against its baseline
        working-directory: backend
        run: |
          set -o pipefail
          status=0
          held() {
            case "$1" in
              0) ;;
              3) echo "::warning title=Not held to its baseline::$2 ran on a CPU model other than its baseline's and differed; see the report (FC-006)" ;;
              *) status=1 ;;
            esac
          }
          covered=""
          for experiment in $(grep -l '^tier = "T2"' eval/experiments/*.toml); do
            code=0
            python -m eval.runner --experiment "$experiment" --ensure-baseline --failures | tee -a t2-report.txt || code=$?
            held "$code" "$experiment"
            covered="$covered $(python -c 'import sys, tomllib; e = tomllib.load(open(sys.argv[1], "rb")); print(e["baseline"], e["candidate"])' "$experiment")"
          done
          for config in $(grep -l '^tier = "T2"' eval/configs/*.toml); do
            case " $covered " in *" $(basename "$config") "*) continue ;; esac
            code=0
            python -m eval.runner --config "$config" --ensure-baseline --failures | tee -a t2-report.txt || code=$?
            held "$code" "$config"
          done
          exit $status
      # EVALUATION.md §5's latency table, with real local speech in and out: faster-whisper hears
      # the voice dataset's questions in real time, a scripted model answers at once, eSpeak NG
      # speaks. Machine-dependent wall-clock numbers, so reported, never held to a baseline.
      - name: Voice loop latency, local recogniser and voice (reported, not a baseline)
        if: always()
        working-directory: backend
        run: |
          set -o pipefail
          python scripts/bench_voice_loop.py --json voice-loop.json | tee -a t2-report.txt
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-report
          path: |
            backend/t2-report.txt
            backend/voice-loop.json
            backend/eval/baselines/stt*.json
          if-no-files-found: ignore
