name: Nightly (tier T2)

# EVALUATION.md §6, tier T2: suites that need local models downloaded first. Today that is `stt`:
# faster-whisper on the synthetic voice dataset, whose weights come from Hugging Face.
#
# Scheduled and on-demand runs start only once this file is on the default branch; until then,
# and afterwards too, it runs whenever what it measures changes.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "backend/eval/suites/stt.py"
      - "backend/eval/configs/stt.toml"
      - "backend/eval/baselines/stt.json"
      - "backend/app/providers/stt/**"
      - "datasets/v1/voice/**"
      - ".github/workflows/nightly.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stt:
    name: Speech recognition, local model (stt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[eval,voice-local]"
      - name: Cache the recogniser's weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('backend/eval/configs/stt.toml') }}
      - name: Every tier-T2 config, against its baseline once it has one
        working-directory: backend
        run: |
          set -o pipefail
          if [ -f eval/baselines/stt.json ]; then
            python -m eval.runner --config eval/configs/*.toml --tier T2 --check-baseline --failures | tee t2-report.txt
          else
            # No baseline yet: write one here and print it, to be reviewed and committed.
            python -m eval.runner --config eval/configs/*.toml --tier T2 --write-baseline --failures | tee t2-report.txt
            cat eval/baselines/stt.json
          fi
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-report
          path: |
            backend/t2-report.txt
            backend/eval/baselines/stt.json
          if-no-files-found: ignore
