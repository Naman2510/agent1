name: Nightly (tier T2)

# EVALUATION.md §6, tier T2: suites that need local models downloaded first. Today that is `stt`:
# faster-whisper on the synthetic voice dataset, whose weights come from Hugging Face.
#
# Scheduled and on-demand runs start only once this file is on the default branch; until then,
# and afterwards too, it runs whenever what it measures changes.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "backend/eval/suites/stt.py"
      - "backend/eval/configs/stt*.toml"
      - "backend/eval/experiments/**"
      - "backend/eval/baselines/stt*.json"
      - "backend/app/providers/stt/**"
      - "datasets/v1/voice/**"
      - ".github/workflows/nightly.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stt:
    name: Speech recognition, local model (stt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[eval,voice-local]"
      - name: Cache the recogniser's weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('backend/eval/configs/stt.toml') }}
      # Two runners once computed different transcripts from the same audio (PHASE_8_AUDIT
      # D8-15). The suite pins the arithmetic itself (eval/suites/stt.py NUMERICS); this records
      # the machine, and which kernels CTranslate2 and MKL chose under those pins.
      - name: Which machine, and which kernels
        working-directory: backend
        run: |
          set -o pipefail
          lscpu | grep -E '^(Model name|Flags)' | cut -c1-200 | tee t2-report.txt
          CT2_VERBOSE=1 python - <<'EOF' 2>&1 | { grep -E 'CPU:|ISA|MKL|backend|WARNING' || true; } | tee -a t2-report.txt
          import numpy as np
          from eval.suites import stt
          stt.pin_numerics()
          from faster_whisper import WhisperModel
          model = WhisperModel("small", device="cpu", compute_type="int8", cpu_threads=4)
          segments, _ = model.transcribe(np.zeros(16000, dtype=np.float32))
          list(segments)
          EOF
      - name: Every tier-T2 config, against its baseline once it has one
        working-directory: backend
        run: |
          set -o pipefail
          status=0
          for config in $(grep -l '^tier = "T2"' eval/configs/*.toml); do
            name=$(basename "$config" .toml)
            if [ -f "eval/baselines/$name.json" ]; then
              python -m eval.runner --config "$config" --check-baseline --failures | tee -a t2-report.txt || status=1
            else
              # No baseline yet: write one here and print it, to be reviewed and committed.
              python -m eval.runner --config "$config" --write-baseline --failures | tee -a t2-report.txt || status=1
              cat "eval/baselines/$name.json"
            fi
          done
          exit $status
      - name: Every registered tier-T2 experiment, decided by its own rule
        if: ${{ !cancelled() }}
        working-directory: backend
        run: |
          set -o pipefail
          for experiment in $(grep -l '^tier = "T2"' eval/experiments/*.toml); do
            python -m eval.runner --experiment "$experiment" | tee -a t2-experiments.txt
          done
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-report
          path: |
            backend/t2-report.txt
            backend/t2-experiments.txt
            backend/eval/baselines/stt*.json
          if-no-files-found: ignore
