#!/usr/sbin/nft -f
# Phase 2 — atomic nftables ruleset.
# Install to: /etc/nftables.conf
# Apply with: nft -c -f /etc/nftables.conf   (check syntax first!)
#             systemctl enable --now nftables
#
# Default-deny inbound, stateful connection tracking, SYN-flood mitigation,
# and an explicit egress allow-list. `flush ruleset` + one atomic `nft -f`
# load means there is never a window with a partially-applied firewall.

flush ruleset

table inet filter {

    # SYN rate limiter (declared inline below): 20 new TCP connection
    # attempts/sec per source IP, above that the packet is dropped
    # (mitigates SYN floods without a separate userspace daemon). nftables
    # creates the named meter "syn-meter" implicitly the first time it's
    # referenced in a rule — no separate top-level declaration needed.

    chain input {
        type filter hook input priority 0; policy drop;

        # Loopback is always trusted.
        iif "lo" accept

        # Established/related flows continue; nothing new gets in for free.
        ct state established,related accept
        ct state invalid drop

        # ICMP: keep path MTU discovery and basic reachability working.
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

        # SSH: rate-limited new connections only from the management VLAN.
        ip saddr 10.10.100.0/24 tcp dport 22 ct state new \
            meter syn-meter { ip saddr limit rate 20/second burst 40 packets } accept

        # Prometheus node_exporter / textfile metrics — management VLAN only.
        ip saddr 10.10.100.0/24 tcp dport 9100 ct state new accept

        # Redfish mock BMC endpoint — management VLAN only.
        ip saddr 10.10.100.0/24 tcp dport 8443 ct state new accept

        # Everything else inbound is logged and dropped by the chain policy.
        log prefix "nft-input-drop: " limit rate 5/minute
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        ct state established,related accept
        ct state invalid drop

        # Allow the isolated diagnostic namespace (diag-ns, via veth) to
        # reach only the outside world, never back into the production LAN.
        iifname "veth-diag*" oifname "eth0" ct state new accept
    }

    chain output {
        type filter hook output priority 0; policy drop;

        oif "lo" accept
        ct state established,related accept

        # Egress allow-list: DNS, NTP, HTTP/S. Nothing else leaves this host.
        udp dport 53 accept
        tcp dport 53 accept
        udp dport 123 accept
        tcp dport { 80, 443 } accept

        # SSH out (e.g. to push metrics/alerts over an SSH tunnel) — narrow
        # this to specific destinations in production.
        tcp dport 22 accept

        log prefix "nft-output-drop: " limit rate 5/minute
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100; policy accept;

        # Egress NAT for the diagnostic namespace so it can reach the
        # internet through the host's uplink without a routable IP of its own.
        ip saddr 169.254.100.0/30 oifname "eth0" masquerade
    }
}
